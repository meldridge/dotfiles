# Logitech M720 Triathlon. Ported from the input-remapper "mark" preset.
# Install with `make keyd` from the repo root.
# keyd only takes whole-line comments, no trailing ones.

[ids]
046d:405e

[main]

# Thumb buttons (BTN_SIDE / BTN_EXTRA)
mouse1 = M-w
mouse2 = M-d

# Wheel tilt
scrollleft  = C-M-left
scrollright = C-M-right
